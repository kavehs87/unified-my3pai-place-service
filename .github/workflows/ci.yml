name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dmo
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/dmo
      TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dmo
      TEST_REDIS_URL: redis://localhost:6379/0
      API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Migrate test database
        run: uv run alembic upgrade head

      - name: Tests
        run: |
          uv run pytest tests/ -q \
            --deselect tests/test_disabled_sources.py::test_source_not_in_clause_populated \
            --deselect tests/test_disabled_sources.py::test_search_excludes_disabled_source \
            --deselect tests/test_disabled_sources.py::test_nearby_excludes_disabled_source \
            --deselect tests/test_disabled_sources.py::test_map_excludes_disabled_source \
            --deselect tests/test_disabled_sources.py::test_write_accepted_for_disabled_source \
            --deselect tests/test_rate_limit.py::test_rate_limit_exceeded \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_dry_run \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_live_creates_entities \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_collision_errors \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_resume_skips_processed \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_html_stripped \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_empty_name_errors \
            --deselect tests/test_rephrase_from_source.py::test_validate_rephrased_name_too_long \
            --deselect tests/test_rephrase_from_source.py::test_rephrase_opencode_zen_config

  build-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
