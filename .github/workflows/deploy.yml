name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (sha-<commit>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deploy assets
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            scripts/deploy-remote.sh docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/ups/"

      - name: Run remote deploy
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /root/ups && cp docker-compose.prod.yml docker-compose.yml && chmod +x deploy-remote.sh && IMAGE_TAG='${{ inputs.image_tag }}' ./deploy-remote.sh"
