[project]
name = "dmo"
version = "0.1.0"
description = "Provider-agnostic data store and query API for tourism/POI data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "geoalchemy2>=0.17.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "redis[hiredis]>=5.2.0,<6.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "greenlet>=3.5.1,<4.0.0",
    "structlog>=24.1.0,<25.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "bleach>=6.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "aiofiles>=24.0.0,<25.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.20,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B006", "B008", "B904", "B905", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmo"]
