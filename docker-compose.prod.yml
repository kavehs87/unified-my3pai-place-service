services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn dmo.main:app --host 0.0.0.0 --port 8000 --workers 8
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - admin_settings:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  db:
    image: postgis/postgis:16-3.4
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=64MB
      -c effective_cache_size=6GB
      -c random_page_cost=1.1
      -c maintenance_work_mem=512MB
      -c wal_buffers=16MB
      -c default_statistics_target=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dmo}
    ports:
      - "5432:5432"
    tmpfs:
      - /dev/shm:rw,noexec,nosuid,size=1G
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 4G

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  admin_settings:
  redis_data:
